name: docker

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - entrypoint.sh
      - docker-bake.hcl
      - .hadolint.yaml
      - .github/workflows/docker.yml
  pull_request:
    paths:
      - Dockerfile
      - entrypoint.sh
      - docker-bake.hcl
      - .hadolint.yaml
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      # Build single-arch locally (not pushed) so the image exists for scanning.
      # Publishing happens ONLY in the `publish` job, which depends on this job
      # passing — including the Grype gate. Nothing is published from here.
      - name: Compute image name
        id: image
        run: |
          echo "base=ghcr.io/${GITHUB_REPOSITORY,,}/insta-mealie" >> "$GITHUB_OUTPUT"

      - name: Build (local, for scan, via bake)
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          targets: image-local
          load: true
          set: |
            *.platform=linux/amd64
            image-local.tags=${{ steps.image.outputs.base }}:ci-${{ github.sha }}

      - name: Grype scan
        id: grype
        uses: anchore/scan-action@v7
        with:
          grype-version: "v0.114.0"
          image: ${{ steps.image.outputs.base }}:ci-${{ github.sha }}
          severity-cutoff: high
          # Push to the default branch fails the build on high+ vulns; PRs report only.
          fail-build: ${{ github.event_name != 'pull_request' }}
          output-format: table
          output-file: grype-insta-mealie.txt

      - name: Show Grype results in job log
        if: always()
        run: cat grype-insta-mealie.txt

      - name: Upload Grype report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-insta-mealie
          path: grype-insta-mealie.txt
          if-no-files-found: warn

  publish:
    name: publish
    needs: scan
    # Publishing happens only on push to main (PRs scan + report, never push).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: |
          echo "base=ghcr.io/${GITHUB_REPOSITORY,,}/insta-mealie" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.base }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push (multi-arch, via bake)
        uses: docker/bake-action@v7
        with:
          source: .
          files: |
            docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file }}
          targets: image-all
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max